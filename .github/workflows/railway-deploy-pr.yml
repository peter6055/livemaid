name: cd/railway-pr

# Spins up an ephemeral Railway environment for each pull request so reviewers
# can click through the change before it is merged. The environment is named
# `pr-<number>`, (re)deployed on every push to the PR, and torn down when the PR
# is closed or merged.
#
# Required configuration (Settings → Secrets and variables → Actions):
#   vars.RAILWAY_PR_PREVIEWS    Set to `true` to enable this workflow. While unset
#                               (the default) both jobs are skipped, so PRs are
#                               never blocked by a missing Railway configuration.
#   secrets.RAILWAY_API_TOKEN   Account/Workspace token — needed for account-level
#                               actions (creating & deleting environments).
#   secrets.RAILWAY_PROJECT_ID  The Railway project ID the PR environments live in.
#   vars.RAILWAY_SERVICE        (optional) Service name to deploy; defaults to the
#                               repository name.
#   vars.RAILWAY_BASE_ENVIRONMENT (optional) Environment to duplicate config/vars
#                               from; defaults to `production`.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  # One in-flight run per PR; a new push supersedes an older deploy.
  group: railway-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Stable, predictable environment name derived from the PR number.
  RAILWAY_ENVIRONMENT_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  # ---------------------------------------------------------------------------
  # Deploy (or update) the PR preview environment.
  # Skipped on `closed`, and skipped for forked PRs because repository secrets
  # are not exposed to pull requests from forks.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy PR preview
    if: >-
      vars.RAILWAY_PR_PREVIEWS == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || github.event.repository.name }}
      BASE_ENVIRONMENT: ${{ vars.RAILWAY_BASE_ENVIRONMENT || 'production' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Create or reuse the PR environment
        run: |
          set -euo pipefail

          # Link to the project so subsequent commands have project context.
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$BASE_ENVIRONMENT" --json

          # Idempotent: only create the environment if it does not already exist.
          if railway environment list --json | grep -q "\"$RAILWAY_ENVIRONMENT_NAME\""; then
            echo "Environment $RAILWAY_ENVIRONMENT_NAME already exists; reusing it."
          else
            echo "Creating environment $RAILWAY_ENVIRONMENT_NAME (duplicating $BASE_ENVIRONMENT)."
            railway environment new "$RAILWAY_ENVIRONMENT_NAME" --duplicate "$BASE_ENVIRONMENT"
          fi

      - name: Deploy and resolve preview URL
        id: deploy
        run: |
          set -euo pipefail

          # Point the CLI at the PR environment + service.
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME" \
            --service "$RAILWAY_SERVICE" \
            --json

          # Build & deploy from the current checkout without streaming logs.
          railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT_NAME" --detach

          # Ensure a public Railway domain exists (idempotent) and capture it.
          DOMAIN_OUTPUT="$(railway domain 2>&1 || true)"
          echo "$DOMAIN_OUTPUT"
          HOST="$(printf '%s' "$DOMAIN_OUTPUT" \
            | grep -oE '[A-Za-z0-9.-]+\.(up\.railway\.app|railway\.app)' \
            | head -n1)"

          if [ -z "$HOST" ]; then
            echo "::warning::Could not resolve a Railway domain from CLI output."
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$HOST" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.url) }};
            const env = process.env.RAILWAY_ENVIRONMENT_NAME;
            const marker = '<!-- railway-pr-preview -->';
            const body = url
              ? `${marker}\n### 🚄 Railway preview environment\n\nEnvironment **\`${env}\`** is live:\n\n👉 ${url}\n\n_Updated for commit ${context.sha.substring(0, 7)}. This environment is destroyed when the PR is closed._`
              : `${marker}\n### 🚄 Railway preview environment\n\nEnvironment **\`${env}\`** was deployed, but a public URL could not be resolved automatically. Check the Railway dashboard.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ---------------------------------------------------------------------------
  # Tear down the PR environment when the pull request is closed or merged.
  # ---------------------------------------------------------------------------
  teardown:
    name: Destroy PR preview
    if: >-
      vars.RAILWAY_PR_PREVIEWS == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Delete the PR environment
        run: |
          set -euo pipefail

          railway link --project "$RAILWAY_PROJECT_ID" --json

          if railway environment list --json | grep -q "\"$RAILWAY_ENVIRONMENT_NAME\""; then
            echo "Deleting environment $RAILWAY_ENVIRONMENT_NAME."
            railway environment delete "$RAILWAY_ENVIRONMENT_NAME" --yes
          else
            echo "Environment $RAILWAY_ENVIRONMENT_NAME does not exist; nothing to delete."
          fi

      - name: Update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const env = process.env.RAILWAY_ENVIRONMENT_NAME;
            const marker = '<!-- railway-pr-preview -->';
            const body = `${marker}\n### 🚄 Railway preview environment\n\nEnvironment **\`${env}\`** has been torn down.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
