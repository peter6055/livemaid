name: cd/railway-pr-preview

on:
  workflow_run:
    workflows:
      - ci/pr-checks
    types:
      - completed
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  deploy_preview:
    if: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null) || (github.event_name == 'pull_request' && github.event.action != 'closed')) && ((github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      RAILWAY_TEMPLATE_ENV_ID: ${{ vars.RAILWAY_TEMPLATE_ENV_ID }}
      PR_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Ensure preview environment
        run: |
          set -euo pipefail
          : "${RAILWAY_API_TOKEN:?RAILWAY_API_TOKEN is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_TEMPLATE_ENV_ID:?RAILWAY_TEMPLATE_ENV_ID is required}"
          export RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN"
          retry_cmd() {
            attempts="$1"
            base_delay="$2"
            shift 2
            count=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$count" -ge "$attempts" ]; then
                return 1
              fi
              sleep "$((base_delay * count))"
              count="$((count + 1))"
            done
          }
          ENV_NAME="pr-$PR_NUMBER"
          retry_cmd 3 5 railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_TEMPLATE_ENV_ID"
          ENVIRONMENTS_JSON="$(retry_cmd 3 5 railway environment list --json)"
          if echo "$ENVIRONMENTS_JSON" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"$ENV_NAME\""; then
            echo "Preview environment $ENV_NAME already exists. Skipping creation."
          else
            retry_cmd 4 5 railway environment new "$ENV_NAME" --copy "$RAILWAY_TEMPLATE_ENV_ID"
          fi

      - name: Deploy preview environment
        run: |
          set -euo pipefail
          : "${RAILWAY_PROJECT_TOKEN:?RAILWAY_PROJECT_TOKEN is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_SERVICE_NAME:?RAILWAY_SERVICE_NAME is required}"
          export RAILWAY_TOKEN="$RAILWAY_PROJECT_TOKEN"
          railway up --detach --service "$RAILWAY_SERVICE_NAME" --environment "pr-$PR_NUMBER" --project "$RAILWAY_PROJECT_ID"

  destroy_preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_TEMPLATE_ENV_ID: ${{ vars.RAILWAY_TEMPLATE_ENV_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Delete preview environment
        run: |
          set -euo pipefail
          : "${RAILWAY_API_TOKEN:?RAILWAY_API_TOKEN is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_TEMPLATE_ENV_ID:?RAILWAY_TEMPLATE_ENV_ID is required}"
          export RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN"
          retry_cmd() {
            attempts="$1"
            base_delay="$2"
            shift 2
            count=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$count" -ge "$attempts" ]; then
                return 1
              fi
              sleep "$((base_delay * count))"
              count="$((count + 1))"
            done
          }
          retry_cmd 3 5 railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_TEMPLATE_ENV_ID"
          retry_cmd 3 5 railway environment delete "pr-$PR_NUMBER" --yes || true
