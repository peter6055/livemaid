name: cd/railway-sandbox

on:
  workflow_run:
    workflows:
      - ci/release
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Inject version and deploy
        run: |
          TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0"
          fi
          echo "export const APP_VERSION = \"${VERSION}\";" > src/lib/version.ts
          echo "Injected version: ${VERSION}"
          railway up --detach --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || github.event.repository.name }}
