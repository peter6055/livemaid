name: cd/railway-sandbox

on:
  workflow_run:
    workflows:
      - ci/release
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Repoint sandbox to off-peak region
        run: node scripts/railway-repoint-region.mjs
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME || github.event.repository.name }}
          RAILWAY_ENVIRONMENT: sandbox

      - name: Bake version from release tag and deploy
        run: |
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No release tag points at workflow commit ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi
          VERSION="${TAG#v}"
          printf '%s\n' "$VERSION" > .build-version
          echo "Baking version ${VERSION} from release tag ${TAG}"
          railway variable set "VERSION=$VERSION" --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_NAME"
          railway up --detach --no-gitignore \
            --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_NAME"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: sandbox
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME || github.event.repository.name }}
