name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and why does it matter?
      placeholder: Describe the user need or workflow gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should LiveMaid do?
      placeholder: Describe the behavior, UI, or workflow you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Visual editor
        - Mermaid parsing or rendering
        - Dashboard or folders
        - Import/export
        - Demo mode
        - Deployment or Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there workarounds, existing tools, or different approaches?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, links, examples, or constraints.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
        - label: I understand LiveMaid is source-available software and some commercial/hosted uses require prior approval.
          required: true
