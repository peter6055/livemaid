version: "3.8"

services:
  livemaid:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  livemaid-demo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
    ports:
      - "3001:3000"
    volumes:
      - ./demo:/app/demo:ro
    environment:
      - NODE_ENV=production
      - DEMO_MODE=true
    restart: unless-stopped
